name: Daily 8 AM Cron Job

on:
  schedule:
    - cron: '0 8 * * *'

jobs:
  daily-job:
    runs-on: ubuntu-latest

    steps:
      - name: Job Started
        run: echo "Daily 8 AM job started!"

      - name: Display Date and Time
        run: date

      - name: Completion Message
        run: echo "Daily job completed successfully!"
